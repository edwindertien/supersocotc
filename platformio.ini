; SuperSoco TC <-> FarDriver bridge, Raspberry Pi Pico W
; Board: Raspberry Pi Pico W (earlephilhower Arduino core)
;
; One environment, one set of sources, one main.cpp. What actually runs
; is controlled by the ENABLE_* feature flags in include/config.h --
; edit those, rebuild, upload. No environment-switching, no
; build_src_filter -- that mechanism (an earlier version of this project
; used two environments to separate a CLI-only step from the full
; bridge) failed twice in a row on real builds and added complexity for
; no benefit over just #if-guarding the code, same pattern already
; proven in your picoControl project (USE_OLED etc).
;
; This config matches the one already proven working in picoControl --
; same platform/board/core lines.

[env:picow]
platform     = https://github.com/maxgerhardt/platform-raspberrypi.git
board        = rpipicow
board_build.core = earlephilhower
framework    = arduino
monitor_speed = 115200

; Adafruit SSD1306 + GFX for the OLED, once that's wired in (I2C on GP4/GP5)
; -- uncomment when you're ready for it, matches picoControl's lib_deps.
; lib_deps =
;     adafruit/Adafruit SSD1306@^2.5.11
;     adafruit/Adafruit GFX Library@^1.11.10
